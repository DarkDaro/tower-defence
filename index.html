<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Защити последнюю цитадель от орд тьмы: 30 волн, 8 видов башен, молнии и огненный дождь, боссы. Играется с телефона и мыши — без установки.">
    <meta name="color-scheme" content="dark">
    <!-- og: карточка для мессенджеров. Когда появится домен — og:image указать абсолютным URL,
         относительный путь Telegram/VK не развернут -->
    <meta property="og:title" content="Цитадель Орды — tower defense в тёмном фэнтези">
    <meta property="og:description" content="Волны орды, башни, заклинания и боссы. Прямо в браузере — с телефона или компьютера.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/og-preview.jpg">
    <meta property="og:image:alt" content="Ночное поле Цитадели Орды: колонна орды на дороге, башни, свет факелов">
    <title>Цитадель Орды — tower defense в тёмном фэнтези</title>
    <!-- иконки: svg для новых браузеров, png/ico — фолбэки, apple — на экран «Домой» -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
    <link rel="shortcut icon" href="assets/favicon.ico">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <!-- установка на телефон: манифест запускает игру в полноэкранном ландшафте без рамок браузера -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0a0505">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Цитадель Орды">
    <link rel="preload" href="assets/fonts/RuslanDisplay-400-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/Cormorant-600-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<noscript><div style="position:fixed;inset:0;background:#0a0505;color:#ffcccc;display:flex;align-items:center;justify-content:center;font-family:serif;font-size:20px;text-align:center;padding:20px;z-index:999;">Орда не поднимется без JavaScript — включи его в настройках браузера.</div></noscript>
<div id="game-wrapper">
    <div id="top-bar">
        <div class="stats">
            <div class="stat"><span class="ic ic-gold"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8" fill="#ffcf7a" stroke="#9a6a10" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="#9a6a10" stroke-width="1.5"/><path d="M12 9v6" stroke="#9a6a10" stroke-width="1.5"/></svg></span> <span id="gold-display">200</span></div>
            <div class="stat"><span class="ic ic-red"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 20C6 15 3.5 11.5 3.5 8.5 3.5 6 5.5 4 8 4c1.7 0 3.2 1 4 2.4C12.8 5 14.3 4 16 4c2.5 0 4.5 2 4.5 4.5 0 3-2.5 6.5-8.5 11.5z" fill="#ff5a4a" stroke="#5a0e0e" stroke-width="1.4"/></svg></span> <span id="lives-display">20</span></div>
            <div class="stat"><span class="ic ic-blue"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2" fill="none" stroke="#8ecbff" stroke-width="2.2" stroke-linecap="round"/><path d="M2 19c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2" fill="none" stroke="#8ecbff" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/></svg></span> <span id="wave-display">0/30</span></div>
            <div id="mana-container"><span class="ic ic-mana"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8" fill="#a58cff" stroke="#3a2470" stroke-width="2"/><ellipse cx="9.5" cy="9" rx="2.6" ry="1.6" fill="#ffffff" opacity="0.75"/><path d="M6 19l6 3 6-3" fill="none" stroke="#3a2470" stroke-width="2" stroke-linecap="round"/></svg></span>
                <div id="mana-bar-bg"><div id="mana-bar-fill"></div><span id="mana-text">0 / 1000</span></div>
            </div>
        </div>
        <div class="buttons">
            <button class="btn" id="pause-btn" aria-label="Пауза"><span class="ic"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="5" width="4.5" height="14" rx="1" fill="#c9c2b4"/><rect x="14.5" y="5" width="4.5" height="14" rx="1" fill="#c9c2b4"/></svg></span> <span class="bname">Пауза</span></button>
            <button class="btn" id="speed-btn" aria-label="Скорость игры"><span class="ic"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 4l9 8-9 8z" fill="#c9c2b4"/><path d="M12 4l9 8-9 8z" fill="#c9c2b4"/></svg></span> x1</button>
            <button class="btn" id="auto-btn" aria-label="Авто-волна"><span class="ic"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 12a6 6 0 0110.5-4" fill="none" stroke="#c9c2b4" stroke-width="2.4" stroke-linecap="round"/><path d="M17 4v4h-4" fill="none" stroke="#c9c2b4" stroke-width="2.4" stroke-linecap="round"/><path d="M18 12a6 6 0 01-10.5 4" fill="none" stroke="#c9c2b4" stroke-width="2.4" stroke-linecap="round"/><path d="M7 20v-4h4" fill="none" stroke="#c9c2b4" stroke-width="2.4" stroke-linecap="round"/></svg></span> <span class="bname">Авто:</span> выкл</button>
            <button class="btn" id="hp-num-btn" title="Цифры здоровья над врагами" aria-label="Цифры здоровья"><span class="ic ic-dim"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z" fill="none" stroke="#c9c2b4" stroke-width="2"/><path d="M4 4l16 16" stroke="#ff5a4a" stroke-width="2.2" stroke-linecap="round"/></svg></span> <span class="bname">Цифры:</span> выкл</button>
            <button class="btn" id="lightning-btn" aria-label="Молния — 300 маны"><span class="ic ic-gold"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M13 2L5 14h5l-1.5 8L19 9h-5.5z" fill="#ffcf7a" stroke="#9a6a10" stroke-width="1.2"/></svg></span> <span class="bname">Молния</span> (300<span class="ic ic-mana"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8" fill="#a58cff" stroke="#3a2470" stroke-width="2"/><ellipse cx="9.5" cy="9" rx="2.6" ry="1.6" fill="#ffffff" opacity="0.75"/><path d="M6 19l6 3 6-3" fill="none" stroke="#3a2470" stroke-width="2" stroke-linecap="round"/></svg></span>)</button>
            <button class="btn" id="frost-btn" aria-label="Ледяной шторм — 400 маны"><span class="ic ic-blue"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g stroke="#8ecbff" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M4 6l16 12M20 6L4 18"/></g></svg></span> <span class="bname">Шторм</span> (400<span class="ic ic-mana"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8" fill="#a58cff" stroke="#3a2470" stroke-width="2"/><ellipse cx="9.5" cy="9" rx="2.6" ry="1.6" fill="#ffffff" opacity="0.75"/><path d="M6 19l6 3 6-3" fill="none" stroke="#3a2470" stroke-width="2" stroke-linecap="round"/></svg></span>)</button>
            <button class="btn" id="fire-rain-btn" aria-label="Огненный дождь — 500 маны"><span class="ic ic-fire"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2c1 4-3 5.5-3 9a3 3 0 006 0c0-1.5-.8-2.5-.8-2.5 2.3 1 4.3 3.4 4.3 6A6.5 6.5 0 015.5 15C5.5 9 11 7.5 12 2z" fill="#ff8a3c" stroke="#7a2400" stroke-width="1.3"/><path d="M12 21a3 3 0 01-3-3c0-1.6 1.6-2.6 3-4 1.4 1.4 3 2.4 3 4a3 3 0 01-3 3z" fill="#ffd75e"/></svg></span> <span class="bname">Дождь</span> (500<span class="ic ic-mana"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8" fill="#a58cff" stroke="#3a2470" stroke-width="2"/><ellipse cx="9.5" cy="9" rx="2.6" ry="1.6" fill="#ffffff" opacity="0.75"/><path d="M6 19l6 3 6-3" fill="none" stroke="#3a2470" stroke-width="2" stroke-linecap="round"/></svg></span>)</button>
            <button class="btn" id="start-wave-btn" aria-label="Начать волну"><span class="ic"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M7 4l13 8-13 8z" fill="#c9c2b4"/></svg></span> <span class="bname">Волна</span></button>
            <button class="btn" id="restart-btn" aria-label="Начать заново"><span class="ic"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 12a8 8 0 11-2.3-5.6" fill="none" stroke="#ffcf7a" stroke-width="2.6" stroke-linecap="round"/><path d="M20 3v5h-5" fill="none" stroke="#ffcf7a" stroke-width="2.6" stroke-linecap="round"/></svg></span> <span class="bname">Заново</span></button>
            <button class="btn" id="sound-btn" aria-label="Звук"><span class="ic ic-gold"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 9v6h4l5 4V5L8 9z" fill="#c9c2b4"/><path d="M16 9a4 4 0 010 6" fill="none" stroke="#ffcf7a" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6.5a8 8 0 010 11" fill="none" stroke="#ffcf7a" stroke-width="2" stroke-linecap="round"/></svg></span> <span class="bname">Звук</span></button><input type="range" id="volume-slider" min="0" max="100" value="80" title="Громкость" aria-label="Громкость">
            <button class="btn" id="fs-btn" title="На весь экран" aria-label="На весь экран"><span class="ic"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="#c9c2b4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span> <span class="bname">Развернуть</span></button>
        </div>
    </div>
    <div class="canvas-container">
        <canvas id="game-canvas" width="1792" height="1008">Поле Орды: ваш браузер не поддерживает canvas.</canvas>
        <div id="multiboard">
            <h3>Убито врагов</h3>
            <div id="kill-list"></div>
            <h3 style="margin-top: 15px;">Статистика</h3>
            <div id="stats-panel" style="font-size: 12px; color: #ffaaaa;"></div>
        </div>
    </div>
    <div id="bottom-bar">
        <div class="tower-btns" id="tower-buttons"></div>
        <div class="info-panel" id="selected-info"></div>
    </div>
</div>
<div id="toast"></div>
<div id="spell-tip" style="display:none;"></div>
<div id="victory-overlay" class="overlay" style="display: none;">
    <div class="overlay-box">
        <h1 id="overlay-title">ПОБЕДА ОРДЫ!</h1>
        <div id="overlay-stats"></div>
        <button class="btn" id="restart-overlay-btn"><span class="ic"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 12a8 8 0 11-2.3-5.6" fill="none" stroke="#ffcf7a" stroke-width="2.6" stroke-linecap="round"/><path d="M20 3v5h-5" fill="none" stroke="#ffcf7a" stroke-width="2.6" stroke-linecap="round"/></svg></span> Играть заново</button>
    </div>
</div>
<div id="pause-overlay" class="overlay" style="display: none;">
    <div class="overlay-box">
        <h1>ПАУЗА</h1>
        <div class="pause-settings">
            <button class="btn" id="pm-resume"><span class="ic"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M7 4l13 8-13 8z" fill="#c9c2b4"/></svg></span> Продолжить</button>
            <button class="btn" id="pm-speed"><span class="ic"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 4l9 8-9 8z" fill="#c9c2b4"/><path d="M12 4l9 8-9 8z" fill="#c9c2b4"/></svg></span> Скорость: x1</button>
            <button class="btn" id="pm-sound"><span class="ic ic-gold"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 9v6h4l5 4V5L8 9z" fill="#c9c2b4"/><path d="M16 9a4 4 0 010 6" fill="none" stroke="#ffcf7a" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6.5a8 8 0 010 11" fill="none" stroke="#ffcf7a" stroke-width="2" stroke-linecap="round"/></svg></span> Звук: вкл</button>
            <button class="btn" id="pm-auto"><span class="ic"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 12a6 6 0 0110.5-4" fill="none" stroke="#c9c2b4" stroke-width="2.4" stroke-linecap="round"/><path d="M17 4v4h-4" fill="none" stroke="#c9c2b4" stroke-width="2.4" stroke-linecap="round"/><path d="M18 12a6 6 0 01-10.5 4" fill="none" stroke="#c9c2b4" stroke-width="2.4" stroke-linecap="round"/><path d="M7 20v-4h4" fill="none" stroke="#c9c2b4" stroke-width="2.4" stroke-linecap="round"/></svg></span> Авто-волна: выкл</button>
            <button class="btn" id="pm-hpnum"></button>
            <button class="btn" id="pm-restart"><span class="ic"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 12a8 8 0 11-2.3-5.6" fill="none" stroke="#ffcf7a" stroke-width="2.6" stroke-linecap="round"/><path d="M20 3v5h-5" fill="none" stroke="#ffcf7a" stroke-width="2.6" stroke-linecap="round"/></svg></span> Заново</button>
        </div>
        <p class="pause-hint">Esc — продолжить · R после победы/поражения — заново</p>
    </div>
</div>

<div id="rotate-overlay" class="overlay" style="display: none;">
    <div class="overlay-box">
        <h1 style="font-size: 30px;">ПОВЕРНИ УСТРОЙСТВО</h1>
        <svg width="58" height="58" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="margin: 6px auto 10px; display: block;"><rect x="8" y="2.5" width="8" height="19" rx="2" fill="none" stroke="#ffcf7a" stroke-width="1.6"/><circle cx="12" cy="18.6" r="0.9" fill="#ffcf7a"/><path d="M2.5 12a9.5 9.5 0 013.2-6.1" fill="none" stroke="#ff8a3c" stroke-width="1.8" stroke-linecap="round"/><path d="M2.6 9.5l.2-3.4 3.2 1.1" fill="none" stroke="#ff8a3c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p class="pause-hint" style="margin-top: 0;">Поле Орды шире, чем выше — в портретном режиме оно умещается в ладонь.</p>
        <button class="btn" id="rotate-dismiss"><span class="ic"><svg class="sicon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M7 4l13 8-13 8z" fill="#c9c2b4"/></svg></span> Играть так</button>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/balance.js"></script>
<script src="js/map.js"></script>
<script src="js/game.js"></script>
</body>
</html>
